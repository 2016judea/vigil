<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vigil</title>
<style>
  :root{
    --ground:#EDEFF1; --face:#F7F8F9; --line:#D3D8DD; --line-soft:#E2E6EA;
    --ink:#12171D; --ink-soft:#4A5560; --ink-mute:#7C8894;
    --lit:#B4710E; --lit-wash:rgba(180,113,14,.10); --glow:rgba(180,113,14,.22);
    --cold:#8A5A72;
    --serif: ui-serif, "New York", "Iowan Old Style", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0F1318; --face:#161B22; --line:#28313C; --line-soft:#1E252E;
      --ink:#E8ECEF; --ink-soft:#AAB5C0; --ink-mute:#77828E;
      --lit:#F0A93B; --lit-wash:rgba(240,169,59,.09); --glow:rgba(240,169,59,.30);
      --cold:#C98FAC;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0F1318; --face:#161B22; --line:#28313C; --line-soft:#1E252E;
    --ink:#E8ECEF; --ink-soft:#AAB5C0; --ink-mute:#77828E;
    --lit:#F0A93B; --lit-wash:rgba(240,169,59,.09); --glow:rgba(240,169,59,.30);
    --cold:#C98FAC;
  }

  *{box-sizing:border-box}
  /* .actions sets display:flex, which outranks the UA rule for [hidden] */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:center; padding:28px;
  }
  .device{
    width:100%; max-width:780px; background:var(--face); border:1px solid var(--line);
    border-radius:3px; display:flex; flex-direction:column; overflow:hidden;
  }

  .bezel{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    padding:13px 22px; border-bottom:1px solid var(--line-soft);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-mute);
  }
  .bezel .count{color:var(--ink-soft)}

  .stage{padding:52px 40px 44px; display:flex; flex-direction:column}

  .lamp{
    display:inline-flex; align-items:center; gap:11px; margin-bottom:26px;
    font-family:var(--mono); font-size:11px; letter-spacing:.15em;
    text-transform:uppercase; color:var(--ink-mute);
  }
  .lamp .bulb{width:9px; height:9px; border-radius:50%; background:var(--ink-mute); opacity:.35}
  .lamp.on{color:var(--lit)}
  .lamp.on .bulb{background:var(--lit); opacity:1; box-shadow:0 0 0 5px var(--glow)}
  .lamp.cold{color:var(--cold)}
  .lamp.cold .bulb{background:var(--cold); opacity:1; box-shadow:none}
  @media (prefers-reduced-motion: no-preference){
    .lamp.on .bulb{animation:breathe 3.4s ease-in-out infinite}
  }
  @keyframes breathe{0%,100%{box-shadow:0 0 0 4px var(--glow)}50%{box-shadow:0 0 0 9px transparent}}

  .reading{
    font-family:var(--serif); font-weight:400; letter-spacing:-.015em; margin:0;
    text-wrap:balance; font-size:clamp(28px,4.2vw,42px); line-height:1.16; color:var(--ink);
  }
  .reading.small{font-size:clamp(24px,3.2vw,33px); line-height:1.26}
  .sub{margin:16px 0 0; font-size:15px; line-height:1.65; color:var(--ink-mute); max-width:58ch}

  .quoted{
    font-family:var(--serif); font-size:19px; line-height:1.5; color:var(--ink);
    border-left:2px solid var(--lit); padding-left:18px; margin:24px 0 0; max-width:56ch;
  }
  .prov{
    font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--ink-mute);
    margin:14px 0 0; line-height:1.75;
  }
  .prov b{color:var(--ink-soft); font-weight:600}

  .actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:30px}
  .act{
    font:inherit; cursor:pointer; border-radius:2px; padding:11px 20px;
    font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
  }
  .act.primary{background:var(--lit); border-color:var(--lit); color:#fff}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .act.primary{color:#0F1318}
  }
  :root[data-theme="dark"] .act.primary{color:#0F1318}
  .act:focus-visible{outline:2px solid var(--lit); outline-offset:2px}

  /* the rail: fleet as marks on a time axis */
  .rail{border-top:1px solid var(--line-soft); padding:20px 40px 26px}
  .railhead{
    display:flex; justify-content:space-between; gap:14px; font-family:var(--mono);
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-mute); margin-bottom:18px;
  }
  .railhead span:last-child{text-align:right}
  .axis{position:relative; height:82px}
  .axisline{position:absolute; left:0; right:0; top:4px; height:1px; background:var(--line)}
  .tick{
    position:absolute; top:0; transform:translateX(-50%); display:flex;
    flex-direction:column; align-items:center; gap:5px; background:none;
    border:0; padding:0 6px; color:inherit; cursor:pointer;
  }
  .tick .mark{width:8px; height:8px; border-radius:50%; background:var(--ink-mute); opacity:.4}
  .tick .stem{width:1px; background:var(--line)}
  .tick .lbl{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.05em;
    color:var(--ink-mute); white-space:nowrap; max-width:15ch;
    overflow:hidden; text-overflow:ellipsis;
  }
  .tick[data-state="working"] .mark{background:var(--ink); opacity:.9}
  .tick[data-state="working"] .lbl{color:var(--ink-soft)}
  .tick[data-state="blocked"] .mark{background:var(--lit); opacity:1; box-shadow:0 0 0 4px var(--glow)}
  .tick[data-state="blocked"] .lbl{color:var(--lit)}
  .tick:hover .lbl,.tick:focus-visible .lbl{color:var(--ink); overflow:visible}
  .tick:focus-visible{outline:2px solid var(--lit); outline-offset:3px; border-radius:2px}
  .railempty{
    font-family:var(--mono); font-size:11px; letter-spacing:.08em;
    color:var(--ink-mute); padding:16px 0 6px;
  }

  /* the second lens: where was I */
  .lens{
    display:flex; gap:14px; align-items:center; margin-top:26px;
    padding-top:20px; border-top:1px solid var(--line-soft);
  }
  .lensbtn{
    font:inherit; cursor:pointer; background:none; border:0; padding:4px 0;
    font-family:var(--mono); font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-mute); border-bottom:1px solid var(--line);
  }
  .lensbtn:hover{color:var(--ink)}
  .lensbtn:focus-visible{outline:2px solid var(--lit); outline-offset:3px}

  .repo{padding:18px 0; border-bottom:1px solid var(--line-soft)}
  .repo:last-child{border-bottom:0}
  .repohead{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
  .reponame{font-family:var(--serif); font-size:20px; color:var(--ink)}
  .repowhen{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; color:var(--ink-mute)}
  .loops{
    font-family:var(--mono); font-size:11px; letter-spacing:.05em;
    color:var(--lit); margin:8px 0 0;
  }
  .files{
    font-family:var(--mono); font-size:10.5px; color:var(--ink-mute);
    margin:6px 0 0; line-height:1.8; word-break:break-all;
  }
  .said{font-size:14px; line-height:1.6; color:var(--ink-soft); margin:10px 0 0; max-width:64ch}
  .said b{
    font-family:var(--mono); font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-mute); font-weight:600;
    display:block; margin-bottom:3px;
  }

  @media (max-width:640px){
    body{padding:0; align-items:flex-start}
    .device{border-left:0; border-right:0; border-radius:0; min-height:100vh}
    .stage{padding:38px 22px 32px}
    .rail{padding:18px 22px 24px}
    .railhead{flex-direction:column; gap:4px}
    .railhead span:last-child{text-align:left}
    .axis{height:92px}
    .tick .lbl{font-size:9px; max-width:11ch}
  }
</style>
</head>
<body>
<main class="device">
  <div class="bezel">
    <span>Vigil</span>
    <span class="count" id="count">&#8212;</span>
  </div>

  <div class="stage">
    <div class="lamp" id="lamp"><span class="bulb"></span><span id="lampword">Waking</span></div>
    <p class="reading" id="reading">&#8230;</p>
    <p class="sub" id="sub" hidden></p>
    <blockquote class="quoted" id="quoted" hidden></blockquote>
    <p class="prov" id="prov" hidden></p>
    <div class="actions" id="actions" hidden>
      <button type="button" class="act primary" id="copyId">Copy session id</button>
    </div>

    <div class="lens">
      <button type="button" class="lensbtn" id="toLens">Where was I</button>
    </div>
  </div>

  <div class="stage" id="lensview" hidden style="padding-top:38px">
    <div class="lamp"><span class="bulb"></span><span>Where was I</span></div>
    <p class="reading small" id="lensHead">&#8230;</p>
    <div id="repos" style="margin-top:26px"></div>
    <div class="lens">
      <button type="button" class="lensbtn" id="toFleet">Back to the fleet</button>
    </div>
  </div>

  <div class="rail">
    <div class="railhead">
      <span>Now</span>
      <span>Quiet &#8592; how long since it spoke &#8594; Stale</span>
    </div>
    <div class="axis" id="axis"><div class="axisline"></div></div>
    <p class="railempty" id="railempty" hidden>No sessions running.</p>
  </div>
</main>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  function human(s){
    if (s < 60) return Math.round(s) + "s";
    if (s < 3600) return Math.round(s / 60) + "m";
    if (s < 86400) return (s / 3600).toFixed(1).replace(/\.0$/, "") + "h";
    return Math.round(s / 86400) + "d";
  }

  // Position on the rail: log over six hours of silence, so a fresh fleet
  // (everything within a minute) still spreads instead of piling at the origin.
  var SPAN = 6 * 3600;
  function pos(quiet){
    var t = Math.min(1, Math.log10(1 + Math.max(0, quiet)) / Math.log10(1 + SPAN));
    return 6 + t * 84;
  }

  var MIN_MARK = 9;   // % separation two marks need to stay distinguishable
  var MIN_GAP  = 22;  // % separation a label needs to sit on the top row

  // Marks must never overlap even when several sessions share a moment, so push
  // right to honour MIN_MARK, then shift the whole run back if it overruns.
  function spread(values){
    var out = values.slice();
    for (var i = 1; i < out.length; i++){
      if (out[i] - out[i - 1] < MIN_MARK) out[i] = out[i - 1] + MIN_MARK;
    }
    var over = out.length ? out[out.length - 1] - 94 : 0;
    if (over > 0) for (var j = 0; j < out.length; j++) out[j] = Math.max(6, out[j] - over);
    return out;
  }

  function drawRail(sessions){
    var axis = $("axis");
    Array.prototype.slice.call(axis.querySelectorAll(".tick")).forEach(function(n){ n.remove(); });
    $("railempty").hidden = sessions.length > 0;

    var ordered = sessions.slice().sort(function(a, b){ return a.quiet_s - b.quiet_s; });
    var placed = spread(ordered.map(function(s){ return pos(s.quiet_s); }));

    // Pack labels into as many rows as it takes. Two rows is not enough: with
    // four sessions inside a couple of minutes, both fill and the third label
    // lands back on row 0 and collides. Grow instead of overlapping -- ever.
    var rowEnds = [];
    ordered.forEach(function(s, i){
      var p = placed[i];
      var row = 0;
      while (row < rowEnds.length && p - rowEnds[row] < MIN_GAP) row++;
      rowEnds[row] = p;

      var b = document.createElement("button");
      b.type = "button";
      b.className = "tick";
      b.dataset.state = s.state;
      b.style.left = p + "%";
      b.title = s.title + "  —  " + s.repo + ", quiet " + human(s.quiet_s);
      b.setAttribute("aria-label",
        s.repo + ": " + s.title + ", " + s.state + ", quiet " + human(s.quiet_s));
      b.innerHTML =
        '<span class="mark"></span>' +
        '<span class="stem" style="height:' + (8 + row * 22) + 'px"></span>' +
        '<span class="lbl"></span><span class="lbl"></span>';
      var lbls = b.querySelectorAll(".lbl");
      lbls[0].textContent = shortName(s);
      lbls[1].textContent = human(s.quiet_s);
      b.addEventListener("click", function(){ show(s); });
      axis.appendChild(b);
    });
    axis.style.height = (60 + rowEnds.length * 22) + "px";
  }

  // several sessions usually share a repo, so the mark needs the session's own
  // name to distinguish them -- one repo name three times over says nothing
  function shortName(s){
    // strip the leading verb, then let CSS ellipsize -- chopping to two words
    // turns "Add book and author names" into the uninformative "book and"
    if (/^untitled/.test(s.title || "")) return s.id;
    var t = (s.title || "").replace(/^(Set up|Add|Review|Generate|Plan for|Build|Fix)\s+/i, "");
    return t || s.repo;
  }

  var current = null;

  function show(s){
    // pressing a mark reveals that session without leaving the resting design
    $("reading").textContent = s.title || s.repo;
    $("reading").className = "reading small";
    $("sub").hidden = true;
    $("quoted").hidden = !s.claude;
    $("quoted").textContent = s.claude ? s.claude.slice(0, 240) : "";
    $("prov").hidden = false;
    $("prov").innerHTML = "<b>" + esc(s.repo) + "</b> · " + esc(s.state) +
      " · quiet " + human(s.quiet_s) + "<br>" + esc(s.sessionId);
    $("actions").hidden = false;
    current = s;
  }

  function esc(t){
    return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function render(st){
    var n = st.sessions.length;
    $("count").textContent = n + (n === 1 ? " session" : " sessions") +
      (st.repos.length ? " · " + st.repos.length + (st.repos.length === 1 ? " repo" : " repos") : "");

    var lamp = $("lamp");
    lamp.className = "lamp" + (st.lamp ? " on" : "");
    $("lampword").textContent = st.lamp ? "Needs you" : "Clear";

    $("reading").textContent = st.headline;
    $("reading").className = "reading" + (st.lamp ? " small" : "");

    var f = st.focus;
    if (st.lamp && f) {
      $("sub").hidden = true;
      var ask = f.asked || f.claude || "";
      $("quoted").hidden = !ask;
      $("quoted").textContent = ask.slice(0, 240);
      $("prov").hidden = false;
      $("prov").innerHTML = "<b>" + esc(f.repo) + " · " + esc(f.title) + "</b><br>" +
        "waiting " + human(f.quiet_s) +
        (f.pending && f.pending.length ? " on " + esc(f.pending.join(", ")) : "") +
        "<br>" + esc(f.sessionId);
      $("actions").hidden = false;
      current = f;
    } else {
      $("quoted").hidden = true;
      $("prov").hidden = true;
      $("actions").hidden = true;
      $("sub").hidden = false;
      $("sub").textContent = n === 0
        ? "Nothing is running. Nothing to watch."
        : (n === 1 ? "One session is out. " : n + " sessions are out. ") +
          "Nothing has been quiet longer than " +
          human(Math.max.apply(null, st.sessions.map(function(s){ return s.quiet_s; }))) + ".";
      current = null;
    }

    drawRail(st.sessions);
  }

  // If the daemon dies, a vigil that keeps reporting "clear" is the worst
  // possible failure -- it looks awake while asleep. Say so instead.
  function asleep(why){
    var lamp = $("lamp");
    lamp.className = "lamp cold";
    $("lampword").textContent = "Not watching";
    $("reading").textContent = "The vigil is not running.";
    $("reading").className = "reading small";
    $("sub").hidden = false;
    $("sub").textContent = why + " Start it with: python3 -m vigil";
    $("quoted").hidden = true;
    $("prov").hidden = true;
    $("actions").hidden = true;
    drawRail([]);
  }

  $("copyId").addEventListener("click", function(){
    if (!current) return;
    navigator.clipboard.writeText(current.sessionId).then(function(){
      var b = $("copyId"), was = b.textContent;
      b.textContent = "Copied";
      setTimeout(function(){ b.textContent = was; }, 1400);
    });
  });

  // ---- the second lens: where was I ----
  function drawRepos(data){
    $("lensHead").textContent = data.headline || "";
    var host = $("repos");
    host.textContent = "";
    (data.repos || []).forEach(function(r){
      var el = document.createElement("div");
      el.className = "repo";
      var when = r.quiet_s ? human(r.quiet_s) + " ago" : "";
      var h = '<div class="repohead"><span class="reponame">' + esc(r.repo) + "</span>" +
              '<span class="repowhen">' + esc(when) +
              (r.branch ? " &#183; " + esc(r.branch) : "") +
              (r.live ? " &#183; live" : "") + "</span></div>";
      if (r.open_loops && r.open_loops.length){
        h += '<p class="loops">' + esc(r.open_loops.join("  \u00b7  ")) + "</p>";
        if (r.dirty_files && r.dirty_files.length){
          h += '<p class="files">' + r.dirty_files.map(esc).join("<br>") + "</p>";
        }
      }
      if (r.you)     h += '<p class="said"><b>you said</b>' + esc(r.you) + "</p>";
      if (r.claude)  h += '<p class="said"><b>it answered</b>' + esc(r.claude) + "</p>";
      el.innerHTML = h;
      host.appendChild(el);
    });
  }

  function showLens(on){
    document.querySelectorAll(".stage")[0].hidden = on;
    $("lensview").hidden = !on;
    document.querySelector(".rail").hidden = on;
    if (on){
      $("lensHead").textContent = "Reading the repos\u2026";
      fetch("/api/continuity").then(function(r){ return r.json(); })
        .then(drawRepos)
        .catch(function(){ $("lensHead").textContent = "Could not read the repos."; });
    }
  }
  $("toLens").addEventListener("click", function(){ showLens(true); });
  $("toFleet").addEventListener("click", function(){ showLens(false); });

  var es;
  function connect(){
    es = new EventSource("/api/stream");
    es.onmessage = function(ev){
      try { render(JSON.parse(ev.data)); } catch (e) { /* keep the last good frame */ }
    };
    es.onerror = function(){
      es.close();
      asleep("Lost contact with the daemon.");
      setTimeout(connect, 4000);
    };
  }

  // exposed so the alarm path can be exercised without waiting for a real
  // permission prompt -- QA'ing only the resting state is how alarms ship broken
  window.vigilRender = render;

  if (location.hash === "#where") showLens(true);

  fetch("/api/state")
    .then(function(r){ return r.json(); })
    .then(render)
    .catch(function(){ asleep("Could not reach the daemon."); })
    .finally(connect);
})();
</script>
</body>
</html>
